name: Dump cards raw (debug)

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Set digit to dump"
        required: false
        default: "8"

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dump raw card info
        env:
          SET: ${{ github.event.inputs.set }}
        run: node scripts/dump-cards-raw.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dump-cards-raw
          path: dump-cards-raw.json
