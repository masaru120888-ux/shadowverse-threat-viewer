name: Refresh card data

# 手動実行のみ。公式APIへの継続的な自動アクセスを避けるため、
# スケジュール（cron）は意図的に設定していません。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dump raw set-8 card info
        run: node scripts/dump-cards-raw.mjs

      - name: Commit dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dump-cards-raw.json
          git commit -m "Add set-8 raw card dump (temp)" || echo "no change"
          git push
