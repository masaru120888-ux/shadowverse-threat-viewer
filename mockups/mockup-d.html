<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mockup D — Clean Mobile</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --text:#1f2530; --muted:#7b8696;
    --line:#e7eaf0; --accent:#4f7cf6; --gold:#c08a1e; --red:#e0413c;
    --damage:#1f2530; --pill:#eef1f6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased;
  }
  .wrap{padding:18px 16px 30px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;}
  .eyebrow{margin:0;color:var(--accent);font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  h1{margin:2px 0 0;font-size:1.55rem;letter-spacing:-.02em;}
  .hp{
    flex:none;display:flex;align-items:baseline;gap:5px;
    padding:8px 14px;border-radius:999px;background:var(--card);
    border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,30,50,.04);
  }
  .hp small{color:var(--muted);font-size:.66rem;font-weight:800;text-transform:uppercase;}
  .hp b{font-size:1.15rem;color:var(--red);}
  .seg{
    display:flex;margin:16px 0 6px;padding:3px;border-radius:12px;
    background:var(--pill);
  }
  .seg button{
    flex:1;border:0;background:transparent;color:var(--muted);
    font:inherit;font-weight:700;font-size:.82rem;padding:8px 0;border-radius:9px;
  }
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(20,30,50,.10);}
  .filters{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
  .filters span{
    padding:7px 13px;border-radius:999px;font-size:.76rem;font-weight:700;
    background:var(--card);border:1px solid var(--line);color:var(--muted);
  }
  .filters span.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .listhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 12px;}
  .listhead h2{margin:0;font-size:1rem;}
  .listhead span{color:var(--muted);font-size:.78rem;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .card{
    display:grid;grid-template-columns:64px 1fr auto;gap:13px;
    padding:13px;border-radius:18px;background:var(--card);
    border:1px solid var(--line);box-shadow:0 2px 8px rgba(20,30,50,.05);
    align-items:center;
  }
  .card.lethal{box-shadow:0 2px 12px rgba(224,65,60,.16);border-color:rgba(224,65,60,.35);}
  .thumb{
    width:64px;height:64px;border-radius:14px;overflow:hidden;position:relative;
    background:linear-gradient(160deg,#dfe5ee,#c7cfdb);flex:none;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;}
  .thumb .ph{
    position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-weight:900;font-size:1.4rem;
    background:linear-gradient(160deg,var(--c1,#9aa6b8),var(--c2,#5c6878));
  }
  .mid{min-width:0;display:flex;flex-direction:column;gap:7px;}
  .name{font-size:.95rem;font-weight:800;line-height:1.25;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tags span{
    padding:3px 9px;border-radius:8px;font-size:.68rem;font-weight:700;
    background:var(--pill);color:var(--muted);
  }
  .detail{margin-top:1px;color:var(--accent);font-size:.74rem;font-weight:700;}
  .dmg{
    flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
    min-width:58px;
  }
  .dmg small{color:var(--muted);font-size:.6rem;font-weight:800;text-transform:uppercase;}
  .dmg b{font-size:1.9rem;font-weight:900;line-height:1;color:var(--damage);}
  .dmg.lethal b{color:var(--red);}
  .dmg.x b{font-size:1.5rem;color:var(--accent);}
  .dmg.range b,.dmg.crest b{font-size:1.05rem;}
  .dmg .x-sub{color:var(--muted);font-size:.72rem;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <p class="eyebrow">相手リーサル確認</p>
      <h1>シャドバリーサルチェッカー</h1>
    </div>
    <div class="hp"><small>HP</small><b>11</b></div>
  </div>

  <div class="seg">
    <button class="on">単体カード</button>
    <button>複数カード</button>
  </div>
  <div class="filters">
    <span class="on">ナイトメア</span>
    <span>ローテーション</span>
    <span>ターン 11</span>
  </div>

  <div class="listhead">
    <h2>脅威カード</h2>
    <span>5枚 · リーサル 2</span>
  </div>

  <div class="list">
    <!-- ベリアル lethal 20 -->
    <article class="card lethal">
      <div class="thumb" style="--c1:#e0746f;--c2:#a13a3a">
        <img src="https://shadowverse-wb.com/uploads/card_image/jpn/card/1943d0a4403944cb883cbc7ceeee7722.png" onerror="this.style.display='none'" alt="">
        <div class="ph">ベ</div>
      </div>
      <div class="mid">
        <div class="name">狡知の堕天司・ベリアル</div>
        <div class="tags"><span>コスト 7</span><span>超進化</span></div>
        <div class="detail">‥詳細を見る</div>
      </div>
      <div class="dmg lethal"><small>打点</small><b>20</b></div>
    </article>

    <!-- シャクドウ lethal 17/16 -->
    <article class="card lethal">
      <div class="thumb" style="--c1:#9a78d8;--c2:#5a3a9a">
        <img src="https://shadowverse-wb.com/uploads/card_image/jpn/card/6222e292845a4c4f949f3703001a796b.png" onerror="this.style.display='none'" alt="">
        <div class="ph">シ</div>
      </div>
      <div class="mid">
        <div class="name">奥夜花・シャクドウ</div>
        <div class="tags"><span>コスト 10</span><span>超進化</span></div>
        <div class="detail">‥詳細を見る</div>
      </div>
      <div class="dmg lethal range"><small>除去込/素</small><b>17/16</b></div>
    </article>

    <!-- ラウラ X -->
    <article class="card">
      <div class="thumb" style="--c1:#5db0c4;--c2:#2a7686">
        <img src="https://shadowverse-wb.com/uploads/card_image/jpn/card/3da084ba39ae4db984505d3a516f4ec5.png" onerror="this.style.display='none'" alt="">
        <div class="ph">ラ</div>
      </div>
      <div class="mid">
        <div class="name">クルーエルウォー・ラウラ</div>
        <div class="tags"><span>コスト 4</span><span>超進化</span></div>
        <div class="detail">‥詳細を見る</div>
      </div>
      <div class="dmg x"><small>打点</small><b>X <span class="x-sub">+1</span></b></div>
    </article>

    <!-- エクセラ range -->
    <article class="card">
      <div class="thumb" style="--c1:#5db0c4;--c2:#2a7686">
        <img src="https://shadowverse-wb.com/uploads/card_image/jpn/card/8b62c124c9614b18a13c726e0ae70ff1.png" onerror="this.style.display='none'" alt="">
        <div class="ph">エ</div>
      </div>
      <div class="mid">
        <div class="name">ノクターンジェネラル・エクセラ</div>
        <div class="tags"><span>コスト 5</span><span>超/進/通</span></div>
        <div class="detail">‥詳細を見る</div>
      </div>
      <div class="dmg range"><small>変動</small><b>8/7/4<br>〜4/3/1</b></div>
    </article>

    <!-- マーウィン crest -->
    <article class="card">
      <div class="thumb" style="--c1:#d8b45e;--c2:#9a7a2a">
        <img src="https://shadowverse-wb.com/uploads/card_image/jpn/card/38a27d8bcad746deb87c6095ed0c5a01.png" onerror="this.style.display='none'" alt="">
        <div class="ph">マ</div>
      </div>
      <div class="mid">
        <div class="name">絶望の顕現・マーウィン</div>
        <div class="tags"><span>コスト 4</span><span>クレスト</span></div>
        <div class="detail">‥詳細を見る</div>
      </div>
      <div class="dmg crest"><small>クレスト</small><b>5/4/3/2/1</b></div>
    </article>
  </div>
</div>
</body>
</html>
